# Практическая работа 02: поиск секретов до сборки и SAST.
# Порог (учебный): блокировать продвижение при ЛЮБОМ секрете и при SAST-находках уровня
# ERROR (соответствует High/Critical). Техническая ошибка сканера тоже блокирует.

stages:
  - secrets
  - build
  - test
  - sast
  - sca
  - sbom
  - package
  - image
  - image-check
  - publish

variables:
  MAVEN_CLI_OPTS: "-B -ntp"
  GITLEAKS_VERSION: "v8.30.1"
  SEMGREP_VERSION: "1.185.0"
  TRIVY_VERSION: "v0.76.2"
  # Адрес и путь реестра согласуются с преподавателем; учётные данные — в переменных CI/CD
  DOCKER_REGISTRY: "registry.gitflic.mtuci.ru"

default:
  image:
    name: maven:3.9.9-eclipse-temurin-21
    pull_policy: if-not-present
  cache:
    key: maven-repo
    paths:
      - .m2/repository/

secrets:
  stage: secrets
  tags:
    - barkov
  script:
    - curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - gitleaks version
    - git fetch --unshallow 2>/dev/null || true
    # Проверяем рабочее дерево и доступную историю текущей ветки; секреты маскируются (--redact)
    - gitleaks detect --source . --report-format json --report-path gitleaks-report.json --redact --log-opts="--all" -v
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week

build:
  stage: build
  tags:
    - barkov
  needs:
    - secrets
  script:
    - mvn $MAVEN_CLI_OPTS clean compile

test:
  stage: test
  tags:
    - barkov
  needs:
    - build
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
    reports:
      junit:
        paths:
          - target/surefire-reports/TEST-*.xml
    expire_in: 1 week

sast:
  stage: sast
  tags:
    - barkov
  needs:
    - test
  script:
    - apt-get update -qq && apt-get install -y -qq python3-pip >/dev/null
    - pip3 install -q semgrep==${SEMGREP_VERSION}
    - semgrep --version
    # Набор правил: Java и web (OWASP Top-10). Уровень ERROR = High/Critical: при нём задача падает.
    - semgrep scan --config p/java --config p/owasp-top-ten --config p/secrets --error --json --output semgrep-report.json src/ || SAST_EXIT=$?
    - SAST_EXIT=${SAST_EXIT:-0}
    - if [ "$SAST_EXIT" -eq 2 ]; then echo "SAST: техническая ошибка сканера — проверка не состоялась"; fi
    - if [ "$SAST_EXIT" -eq 1 ]; then echo "SAST: найдены блокирующие находки уровня High/Critical"; fi
    - exit $SAST_EXIT
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week

sca:
  stage: sca
  tags:
    - barkov
  needs:
    - test
  variables:
    # API-ключ NVD задаётся в настройках CI/CD проекта (Settings -> Variables)
    NVD_API_KEY: "$NVD_API_KEY"
  cache:
    key: odc-database
    paths:
      - .odc-data/
  script:
    # Анализ прямых и транзитивных зависимостей; кэш базы - только для ускорения,
    # фиксируем дату отчёта. Недоступная база НЕ означает отсутствие CVE: задача падает.
    - mvn $MAVEN_CLI_OPTS -Dmaven.repo.local=.m2/repository org.owasp:dependency-check-maven:12.1.3:check -DdataDirectory=$CI_PROJECT_DIR/.odc-data -DnvdApiKey="$NVD_API_KEY" -DfailBuildOnCVSS=7 -Dformats=HTML,JSON
    - echo "SCA отчёт готов; дата базы внутри dependency-check-report.html"
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json
    expire_in: 1 week

sbom:
  stage: sbom
  tags:
    - barkov
  needs:
    - test
  script:
    - mvn $MAVEN_CLI_OPTS org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputDirectory=$CI_PROJECT_DIR/target/sbom
    - sha256sum target/sbom/bom.json > target/sbom/bom.json.sha256
    - echo "commit: $CI_COMMIT_SHA" > target/sbom/build-metadata.txt
  artifacts:
    paths:
      - target/sbom/bom.json
      - target/sbom/bom.json.sha256
      - target/sbom/build-metadata.txt
    expire_in: 1 week

package:
  stage: package
  tags:
    - barkov
  needs:
    - test
    - sast
    - sca
  script:
    - mvn $MAVEN_CLI_OPTS package
    - sha256sum target/course-management-0.0.1-SNAPSHOT.jar > target/jar.sha256
  artifacts:
    paths:
      - target/course-management-0.0.1-SNAPSHOT.jar
      - target/jar.sha256
    expire_in: 1 week

image-build:
  stage: image
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  needs:
    - package
  script:
    # Механизм сборки образов на агенте согласуется с преподавателем (socket/DinD).
    - docker build --build-arg COMMIT_SHA=$CI_COMMIT_SHA -t course-management:$CI_COMMIT_SHORT_SHA .
    - docker save course-management:$CI_COMMIT_SHORT_SHA -o image.tar
    - sha256sum image.tar > image.tar.sha256
    - echo "commit SHA: $CI_COMMIT_SHA" > image-commit.txt
  artifacts:
    paths:
      - image.tar
      - image.tar.sha256
      - image-commit.txt
    expire_in: 1 week

config-check:
  stage: image-check
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  script:
    - apk add --no-cache curl tar >/dev/null
    - curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
    - tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
    - trivy --version
    # Проверка конфигурации Dockerfile: блокировка при HIGH/CRITICAL
    - trivy config --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-config.json Dockerfile || CFG_EXIT=$?
    - CFG_EXIT=${CFG_EXIT:-0}
    - if [ "$CFG_EXIT" -eq 1 ]; then echo "Trivy config: блокирующие нарушения Dockerfile"; fi
    - exit $CFG_EXIT
  artifacts:
    when: always
    paths:
      - trivy-config.json
    expire_in: 1 week

image-check:
  stage: image-check
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  needs:
    - image-build
  script:
    - apk add --no-cache curl tar >/dev/null
    - curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
    - tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
    - trivy --version
    # Проверка собранного образа: ОС и библиотеки приложения, порог HIGH/CRITICAL
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-image.json --ignore-unfixed || IMG_EXIT=$?
    - IMG_EXIT=${IMG_EXIT:-0}
    - if [ "$IMG_EXIT" -eq 1 ]; then echo "Trivy image: найдены блокирующие уязвимости High/Critical"; fi
    - exit $IMG_EXIT
  artifacts:
    when: always
    paths:
      - trivy-image.json
    expire_in: 1 week

publish:
  stage: publish
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  # Публикация только после всех проверок работ 02-04: секреты, SAST, SCA, Dockerfile, образ
  needs:
    - secrets
    - sast
    - sca
    - config-check
    - image-check
  script:
    - docker load -i image.tar
    - docker login "$DOCKER_REGISTRY" -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD"
    - docker tag course-management:$CI_COMMIT_SHORT_SHA "$DOCKER_REGISTRY/$IMAGE_PATH:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_REGISTRY/$IMAGE_PATH:$CI_COMMIT_SHORT_SHA" 2>&1 | tee push.log
    - grep -oE "sha256:[a-f0-9]{64}" push.log | tail -1 > digest.txt
    - echo "образ: $DOCKER_REGISTRY/$IMAGE_PATH:$CI_COMMIT_SHORT_SHA" >> digest.txt
  artifacts:
    paths:
      - digest.txt
      - push.log
    expire_in: 1 week
