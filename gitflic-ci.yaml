# Практическая работа 02: поиск секретов до сборки и SAST.
# Порог (учебный): блокировать продвижение при ЛЮБОМ секрете и при SAST-находках уровня
# ERROR (соответствует High/Critical). Техническая ошибка сканера тоже блокирует.

stages:
  - secrets
  - build
  - test
  - sast
  - sca
  - sbom
  - package
  - image
  - image-check
  - publish
  - deploy
  - dast
  - fuzz
  - cleanup

variables:
  MAVEN_CLI_OPTS: "-B -ntp"
  GITLEAKS_VERSION: "v8.30.1"
  SEMGREP_VERSION: "1.185.0"
  TRIVY_VERSION: "v0.76.2"
  ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:2.17.0"
  SCHEMATHESIS_IMAGE: "schemathesis/schemathesis:4.33.4"
  # Адрес и путь реестра согласуются с преподавателем; учётные данные — в переменных CI/CD
  DOCKER_REGISTRY: "registry.gitflic.mtuci.ru"

default:
  image:
    name: maven:3.9.9-eclipse-temurin-21
    pull_policy: if-not-present
  cache:
    key: maven-repo
    paths:
      - .m2/repository/

secrets:
  stage: secrets
  tags:
    - barkov
  script:
    - curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - gitleaks version
    - git fetch --unshallow 2>/dev/null || true
    # Проверяем рабочее дерево и доступную историю текущей ветки; секреты маскируются (--redact)
    - gitleaks detect --source . --report-format json --report-path gitleaks-report.json --redact --log-opts="--all" -v
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week

build:
  stage: build
  tags:
    - barkov
  needs:
    - secrets
  script:
    - mvn $MAVEN_CLI_OPTS clean compile

test:
  stage: test
  tags:
    - barkov
  needs:
    - build
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
    reports:
      junit:
        paths:
          - target/surefire-reports/TEST-*.xml
    expire_in: 1 week

sast:
  stage: sast
  tags:
    - barkov
  needs:
    - test
  script:
    - apt-get update -qq && apt-get install -y -qq python3-pip >/dev/null
    - pip3 install -q semgrep==${SEMGREP_VERSION}
    - semgrep --version
    # Набор правил: Java и web (OWASP Top-10). Уровень ERROR = High/Critical: при нём задача падает.
    - semgrep scan --config p/java --config p/owasp-top-ten --config p/secrets --error --json --output semgrep-report.json src/ || SAST_EXIT=$?
    - SAST_EXIT=${SAST_EXIT:-0}
    - if [ "$SAST_EXIT" -eq 2 ]; then echo "SAST: техническая ошибка сканера — проверка не состоялась"; fi
    - if [ "$SAST_EXIT" -eq 1 ]; then echo "SAST: найдены блокирующие находки уровня High/Critical"; fi
    - exit $SAST_EXIT
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week

sca:
  stage: sca
  tags:
    - barkov
  needs:
    - test
  variables:
    # API-ключ NVD задаётся в настройках CI/CD проекта (Settings -> Variables)
    NVD_API_KEY: "$NVD_API_KEY"
  cache:
    key: odc-database
    paths:
      - .odc-data/
  script:
    # Анализ прямых и транзитивных зависимостей; кэш базы - только для ускорения,
    # фиксируем дату отчёта. Недоступная база НЕ означает отсутствие CVE: задача падает.
    - mvn $MAVEN_CLI_OPTS -Dmaven.repo.local=.m2/repository org.owasp:dependency-check-maven:12.1.3:check -DdataDirectory=$CI_PROJECT_DIR/.odc-data -DnvdApiKey="$NVD_API_KEY" -DfailBuildOnCVSS=7 -Dformats=HTML,JSON
    - echo "SCA отчёт готов; дата базы внутри dependency-check-report.html"
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json
    expire_in: 1 week

sbom:
  stage: sbom
  tags:
    - barkov
  needs:
    - test
  script:
    - mvn $MAVEN_CLI_OPTS org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputDirectory=$CI_PROJECT_DIR/target/sbom
    - sha256sum target/sbom/bom.json > target/sbom/bom.json.sha256
    - echo "commit: $CI_COMMIT_SHA" > target/sbom/build-metadata.txt
  artifacts:
    paths:
      - target/sbom/bom.json
      - target/sbom/bom.json.sha256
      - target/sbom/build-metadata.txt
    expire_in: 1 week

package:
  stage: package
  tags:
    - barkov
  needs:
    - test
    - sast
    - sca
  script:
    - mvn $MAVEN_CLI_OPTS package
    - sha256sum target/course-management-0.0.1-SNAPSHOT.jar > target/jar.sha256
  artifacts:
    paths:
      - target/course-management-0.0.1-SNAPSHOT.jar
      - target/jar.sha256
    expire_in: 1 week

image-build:
  stage: image
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  needs:
    - package
  script:
    # Механизм сборки образов на агенте согласуется с преподавателем (socket/DinD).
    - docker build --build-arg COMMIT_SHA=$CI_COMMIT_SHA -t course-management:$CI_COMMIT_SHORT_SHA .
    - docker save course-management:$CI_COMMIT_SHORT_SHA -o image.tar
    - sha256sum image.tar > image.tar.sha256
    - echo "commit SHA: $CI_COMMIT_SHA" > image-commit.txt
  artifacts:
    paths:
      - image.tar
      - image.tar.sha256
      - image-commit.txt
    expire_in: 1 week

config-check:
  stage: image-check
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  script:
    - apk add --no-cache curl tar >/dev/null
    - curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
    - tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
    - trivy --version
    # Проверка конфигурации Dockerfile: блокировка при HIGH/CRITICAL
    - trivy config --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-config.json Dockerfile || CFG_EXIT=$?
    - CFG_EXIT=${CFG_EXIT:-0}
    - if [ "$CFG_EXIT" -eq 1 ]; then echo "Trivy config: блокирующие нарушения Dockerfile"; fi
    - exit $CFG_EXIT
  artifacts:
    when: always
    paths:
      - trivy-config.json
    expire_in: 1 week

image-check:
  stage: image-check
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  needs:
    - image-build
  script:
    - apk add --no-cache curl tar >/dev/null
    - curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
    - tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
    - trivy --version
    # Проверка собранного образа: ОС и библиотеки приложения, порог HIGH/CRITICAL
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-image.json --ignore-unfixed || IMG_EXIT=$?
    - IMG_EXIT=${IMG_EXIT:-0}
    - if [ "$IMG_EXIT" -eq 1 ]; then echo "Trivy image: найдены блокирующие уязвимости High/Critical"; fi
    - exit $IMG_EXIT
  artifacts:
    when: always
    paths:
      - trivy-image.json
    expire_in: 1 week

publish:
  stage: publish
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  # Публикация только после всех проверок работ 02-04: секреты, SAST, SCA, Dockerfile, образ
  needs:
    - secrets
    - sast
    - sca
    - config-check
    - image-check
  script:
    - docker load -i image.tar
    - docker login "$DOCKER_REGISTRY" -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD"
    - docker tag course-management:$CI_COMMIT_SHORT_SHA "$DOCKER_REGISTRY/$IMAGE_PATH:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_REGISTRY/$IMAGE_PATH:$CI_COMMIT_SHORT_SHA" 2>&1 | tee push.log
    - grep -oE "sha256:[a-f0-9]{64}" push.log | tail -1 > digest.txt
    - echo "образ: $DOCKER_REGISTRY/$IMAGE_PATH:$CI_COMMIT_SHORT_SHA" >> digest.txt
  artifacts:
    paths:
      - digest.txt
      - push.log
    expire_in: 1 week

deploy:
  stage: deploy
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  needs:
    - publish
  script:
    - apk add --no-cache curl >/dev/null
    - DEPLOY_REF=$(head -1 digest.txt)
    - echo "Разворачиваем по digest без пересборки: $DEPLOY_REF"
    - docker login "$DOCKER_REGISTRY" -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD"
    - docker pull "$DEPLOY_REF"
    - docker network create zapnet-$CI_PIPELINE_ID
    - docker run -d --name app-$CI_PIPELINE_ID --network zapnet-$CI_PIPELINE_ID -e APP_ADMIN_TOKEN="$ADMIN_TOKEN" "$DEPLOY_REF"
    # Ожидание готовности HTTP: интервал 2 сек, предельное время 120 сек
    - READY=0; for i in $(seq 1 60); do curl -fsS "http://app-$CI_PIPELINE_ID:8080/" >/dev/null 2>&1 && { READY=1; echo "Готовность OK на попытке $i"; break; }; sleep 2; done
    - if [ "$READY" -ne 1 ]; then echo "Приложение не стало доступным"; docker logs app-$CI_PIPELINE_ID > deploy-fail.log 2>&1; exit 1; fi
    - docker logs app-$CI_PIPELINE_ID > deploy-app.log 2>&1 || true
  artifacts:
    when: always
    paths:
      - deploy-app.log
      - deploy-fail.log
    expire_in: 1 week

dast-baseline:
  stage: dast
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  needs:
    - deploy
  script:
    - apk add --no-cache curl >/dev/null
    - docker pull "$ZAP_IMAGE"
    # Baseline проверяет веб-интерфейс. Порог: FAIL-находки (High/Critical) блокируют, WARN (Low/Medium) нет.
    - docker run --rm --network "zapnet-$CI_PIPELINE_ID" -v "$CI_PROJECT_DIR":/zap/wrk:rw "$ZAP_IMAGE" zap-baseline.py -t "http://app-$CI_PIPELINE_ID:8080/" -r zap-baseline.html -J zap-baseline.json || BASE_EXIT=$?
    - BASE_EXIT=${BASE_EXIT:-0}
    - echo "ZAP Baseline exit: $BASE_EXIT (1 = FAIL, 2 = только WARN)"
    - if [ "$BASE_EXIT" -eq 1 ]; then echo "ZAP Baseline: блокирующие FAIL-находки"; fi
    - if [ "$BASE_EXIT" -ne 0 ] && [ "$BASE_EXIT" -ne 2 ]; then exit "$BASE_EXIT"; fi
  artifacts:
    when: always
    paths:
      - zap-baseline.html
      - zap-baseline.json
    expire_in: 1 week

dast-api:
  stage: dast
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  needs:
    - deploy
  script:
    - apk add --no-cache curl >/dev/null
    - docker pull "$ZAP_IMAGE"
    # API Scan по OpenAPI. Тестовая авторизация защищённого маршрута — подстановка X-Admin-Token через ZAP replacer.
    - ZAP_AUTH_ARGS="replacer.full_list(description=admin,enabled=true,matchtype=REQ_HEADER,matchstr=X-Admin-Token,regex=false,replacement=$ADMIN_TOKEN)"
    - docker run --rm --network "zapnet-$CI_PIPELINE_ID" -v "$CI_PROJECT_DIR":/zap/wrk:rw "$ZAP_IMAGE" zap-api-scan.py -t "http://app-$CI_PIPELINE_ID:8080/openapi.yaml" -f openapi -r zap-api.html -J zap-api.json -z "$ZAP_AUTH_ARGS" || API_EXIT=$?
    - API_EXIT=${API_EXIT:-0}
    - echo "ZAP API Scan exit: $API_EXIT (1 = FAIL, 2 = только WARN)"
    - if [ "$API_EXIT" -eq 1 ]; then echo "ZAP API Scan: блокирующие FAIL-находки"; fi
    - if [ "$API_EXIT" -ne 0 ] && [ "$API_EXIT" -ne 2 ]; then exit "$API_EXIT"; fi
  artifacts:
    when: always
    paths:
      - zap-api.html
      - zap-api.json
    expire_in: 1 week

fuzz:
  stage: fuzz
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  needs:
    - deploy
  script:
    - docker pull "$SCHEMATHESIS_IMAGE"
    # Фаззинг API: максимум 100 примеров на операцию, тайм-аут запроса 10 сек, лимит запуска 10 минут.
    - timeout 600 docker run --rm --network "zapnet-$CI_PIPELINE_ID" "$SCHEMATHESIS_IMAGE" run "http://app-$CI_PIPELINE_ID:8080/openapi.yaml" --max-examples 100 --checks all --header "X-Admin-Token: $ADMIN_TOKEN" --request-timeout 10 > schemathesis.log 2>&1 || FUZZ_EXIT=$?
    - FUZZ_EXIT=${FUZZ_EXIT:-0}
    - echo "Schemathesis exit: $FUZZ_EXIT (не 0 = необработанные 5xx или проваленные проверки)"
    - exit $FUZZ_EXIT
  artifacts:
    when: always
    paths:
      - schemathesis.log
    expire_in: 1 week

cleanup:
  stage: cleanup
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  tags:
    - barkov
  when: always
  needs:
    - dast-baseline
    - dast-api
    - fuzz
  script:
    # Очистка только ресурсов СВОЕГО запуска: имена привязаны к $CI_PIPELINE_ID.
    - docker rm -f app-$CI_PIPELINE_ID || true
    - docker network rm zapnet-$CI_PIPELINE_ID || true
    - echo "Временные ресурсы запуска удалены"
